name: Feature request
description: Suggest an improvement to hextcp
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like hextcp to do?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: What investigation or CTF situation would this help with?
    validations:
      required: true
