name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning hextcp.sh tests/run_tests.sh
      - name: Test suite
        run: bash tests/run_tests.sh
      - name: Smoke test against the runner's real socket tables
        run: |
          sudo bash hextcp.sh -a -p
          bash hextcp.sh -j | python3 -c 'import json,sys; [json.loads(l) for l in sys.stdin]'
